# Development overrides — Docker Compose merges this automatically on `docker compose up`.
#
# First-time setup (builds images):
#   docker compose up --build
#
# Every run after that (NO rebuild needed):
#   docker compose up
#
# ── Email setup ──────────────────────────────────────────────────────────────
# Uncomment and fill in the SMTP_* lines below to send real emails.
# Without them, messages are only printed to `docker compose logs backend`.
#
# Gmail quick-start:
#   1. myaccount.google.com → Security → 2-Step Verification  (must be ON)
#   2. myaccount.google.com → Security → App Passwords
#   3. Create → Mail → Other → name it "bathaee"
#   4. Paste the 16-character password into SMTP_PASSWORD below
# ─────────────────────────────────────────────────────────────────────────────

services:
  backend:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PROFILES_JSON_PATH=/data/profiles.json
      # ── Uncomment to enable real email sending ──
      # - SMTP_HOST=smtp.gmail.com
      # - SMTP_PORT=587
      # - SMTP_USER=zmobaraky@gmail.com
      # - SMTP_PASSWORD=xxxx xxxx xxxx xxxx

  frontend:
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
